[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions."sync-bookings-background"]
  schedule = "*/5 * * * *"

# Hourly guest-messaging sweep (WhatsApp breakfast reminders + review
# requests). Fires every hour UTC; the function translates to Europe/Athens
# and only acts on stores whose configured send hour matches. Dry-run only
# until Twilio env vars are set.
[functions."guest-messaging-background"]
  schedule = "0 * * * *"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173

[[redirects]]
  from = "/api/force-sync"
  to = "/.netlify/functions/force-sync-background"
  status = 200

[[redirects]]
  from = "/api/sync-bookings"
  to = "/.netlify/functions/sync-bookings-background"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
